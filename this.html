<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL取得 + iframe表示</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        pre {
            border: 1px solid #ccc;
            background: #f5f5f5;
            padding: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow: auto;
        }
    </style>
</head>
<body>

    <h2>URLの内容取得 + iframe表示</h2>

    <div class="controls">
        <input type="url" id="url" placeholder="https://example.com">
        <button onclick="loadPage()">表示・取得</button>
    </div>

    <iframe id="viewer" src="about:blank"></iframe>

    <h3>取得したHTML</h3>
    <pre id="result">ここにHTMLソースが表示されます。</pre>

    <script>
        async function loadPage() {
            const url = document.getElementById("url").value.trim();
            const iframe = document.getElementById("viewer");
            const result = document.getElementById("result");

            if (!url) {
                result.textContent = "URLを入力してください。";
                return;
            }

            // iframeに表示
            iframe.src = url;

            // HTML取得（CORS制限あり）
            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const text = await response.text();
                result.textContent = text;
            } catch (error) {
                result.textContent =
                    "HTMLを取得できませんでした。\n" +
                    "(CORS制限の可能性があります)\n\n" +
                    error;
            }
        }
    </script>

</body>
</html>
